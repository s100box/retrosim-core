[package]
name = "retrosim-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.1"
description = "Bus-agnostic foundation for retro system simulators"
authors = ["Howard M. Harte"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hharte/retrosim-core"
readme = "README.md"
keywords = ["emulator", "simulator", "retrocomputing", "bus", "z80"]
categories = ["emulators", "simulation"]
exclude = [".github/", ".githooks/", ".gitattributes", "AGENTS.md", "CLAUDE.md"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
